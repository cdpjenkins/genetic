pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.github.johnrengelman.shadow') {
                useModule("com.github.johnrengelman:shadow:${requested.version}")
            }
        }
    }
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'genetic'

